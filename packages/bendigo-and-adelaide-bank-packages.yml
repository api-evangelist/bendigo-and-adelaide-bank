source: >-
  Registry search (PyPI, npm, GitHub) for Bendigo/Adelaide/Up client libraries. Bendigo and
  Adelaide Bank publishes NO official first-party SDK for either the CDR Banking API or the Up
  Developer API. The CDR surface is a shared regulatory standard consumed via accredited-data-
  recipient tooling, not a per-bank SDK. Up ships an OpenAPI spec (up-banking/api) but no
  official client library; the packages below are COMMUNITY-maintained (official: false) and are
  listed for discoverability only. No SDKs pointer is emitted because none are first-party.
