notes: No official hosted or packaged MCP server from Bendigo and Adelaide Bank or its Up brand was found (search 2026-10-20;
  developer.up.com.au/mcp -> 404; developer.up.com.au/llms.txt contains no MCP mention). Several COMMUNITY, unofficial stdio
  servers wrap the Up API (alex1092/up-bank-mcp-server, edkranz/up-mcp, stuliston up-bank-mcp, a Cloudflare Workers up-bank-mcp)
  and each needs the user's own Up personal access token; they are recorded under community_servers and are not provider surfaces.
  This tool list is DERIVED from the public CDR Product Reference Data operations and the Up Banking API operations; authenticated
  CDR data-sharing operations are excluded (they require accredited-data-recipient status, FAPI + MTLS).
