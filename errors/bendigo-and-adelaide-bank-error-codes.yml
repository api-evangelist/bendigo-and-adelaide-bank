problems:
- status: 400
  title: Bad request
  description: Typically a problem with the query string or an encoding error.
- status: 401
  title: Not authorized
  description: The request was not authenticated.
- status: 404
  title: Not found
  description: Either the endpoint does not exist, or the requested resource does not exist.
- status: 422
  title: Invalid request
  description: The request contains invalid data and was not processed.
- status: 429
  title: Too many requests
  description: You have been rate limited.
  remediation: Try later, ideally with exponential backoff. The X-RateLimit-Remaining response header shows the number remaining.
- status: 500
