name: Bendigo and Adelaide Bank
kind: company
description: Bendigo and Adelaide Bank Limited (ASX:BEN) is one of Australia's largest
  retail banks, formed by the 2007 merger of the community-focused Bendigo Bank and
  the wholesale-strong Adelaide Bank, and headquartered in Bendigo, Victoria. The
  group serves millions of customers through the Bendigo Bank, Adelaide Bank, Rural
  Bank, and Up (neobank) brands, with a distinctive Community Bank branch-franchise
  model. As an authorised deposit-taking institution and accredited Consumer Data
  Right (CDR) data holder, the bank exposes public, unauthenticated Product Reference
  Data (PRD) APIs conforming to the Australian Consumer Data Standards, alongside the
  authenticated CDR consumer data-sharing surface governed by the ACCC/DSB rules.
