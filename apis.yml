    type: APIReference
  - url: openapi/bendigo-and-adelaide-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Consumer Data Right banking surface covering Get
    Accounts, Get Bulk Balances, Get Account Balance, and Get Account Detail (GET /banking/accounts,
    /banking/accounts/balances, /banking/accounts/{accountId}/balance, /banking/accounts/{accountId}).
    Not publicly callable - access requires ACCC-accredited data recipient (ADR) status,
    mutual TLS, and explicit consumer consent under the CDR rules. Served on the confirmed
    Bendigo CDR data holder host; the OpenAPI is the shared DSB CDS Banking standard v1.36.0.
