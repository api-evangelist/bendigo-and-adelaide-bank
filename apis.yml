    type: APIReference
  - url: openapi/bendigo-and-adelaide-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Public CDR Product Reference Data API for Up, the digital neobank owned
    by Bendigo and Adelaide Bank, conforming to the shared Australian Consumer Data
    Standards. Confirmed live returning HTTP 200 for GET /banking/products (verified
    2026-07-20). Up separately publishes its own authenticated personal-banking developer
    API at api.up.com.au/api/v1.
