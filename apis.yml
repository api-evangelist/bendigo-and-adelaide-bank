  - url: openapi/bendigo-and-adelaide-bank-up-developer-api-openapi.json
    type: OpenAPI
  description: First-party personal-banking developer API for Up, the digital neobank
    owned by Bendigo and Adelaide Bank. A genuine bank-proprietary REST API (JSON:API
    style) letting an Up customer read their own accounts, transactions, categories,
    tags, and attachments, and register webhooks, authenticated with a personal access
    token. Confirmed live - api.up.com.au/api/v1 returns HTTP 401 (auth required) when
    unauthenticated (verified 2026-07-21). OpenAPI 3.0.3 (17 paths) harvested verbatim
    from Up's public up-banking/api GitHub repository.
