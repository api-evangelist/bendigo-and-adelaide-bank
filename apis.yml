  - url: openapi/bendigo-and-adelaide-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer Data Right Product Reference Data for the Adelaide Bank brand.
    Adelaide Bank is a division of Bendigo and Adelaide Bank Limited, which is a single
    accredited CDR data holder; the standalone host api.cdr.adelaidebank.com.au does
    NOT resolve (DNS NXDOMAIN, verified 2026-07-21), so the Adelaide brand's product
    data is served through the group's confirmed Bendigo CDR data holder host. Listed
    with the confirmed working host, not an invented one; the OpenAPI is the shared
    DSB CDS Banking standard v1.36.0.
