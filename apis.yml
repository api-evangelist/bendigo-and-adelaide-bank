  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.bendigobank.com.au/cdr/
  baseURL: https://api.cdr.bendigobank.com.au/cds-au/v1/banking/products
  properties:
  - url: https://www.bendigobank.com.au/cdr/
    type: Documentation
  - url: https://www.bendigoadelaide.com.au/banking-products-api/
    type: SignupURL
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-products
    type: APIReference
  - url: openapi/bendigo-and-adelaide-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Public, unauthenticated Consumer Data Right Product Reference Data API
    for the Bendigo Bank brand, exposing GET /banking/products and GET /banking/products/{productId}
    per the Australian Consumer Data Standards. Confirmed live returning HTTP 200 at
    x-v 4 (verified 2026-07-21). This is the only CDR family that is callable without
    accreditation or consumer consent; the OpenAPI pointer is the shared DSB CDS Banking
    standard (v1.36.0), which the bank is legally required to implement, not a proprietary spec.
- aid: bendigo-and-adelaide-bank:bendigo-and-adelaide-bank-cds-banking-accounts-api
