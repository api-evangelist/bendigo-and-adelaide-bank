versioning:
  scheme: header-negotiated
  request_headers: [x-v, x-min-v]
  response_header: x-v
  detail: >-
    Clients send x-v (required, positive integer) and optional x-min-v; the server responds with
    the highest supported version in [x-min-v, x-v] and echoes it in the x-v response header.
    Unsupported versions return 406 (urn:au-cds:error:cds:header:unsupported-version).
  see: lifecycle/bendigo-and-adelaide-bank-lifecycle.yml
request_tracing:
  header: x-fapi-interaction-id
